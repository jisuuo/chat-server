services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chatserver
      POSTGRES_USER: chatserver
      POSTGRES_PASSWORD: chatserver
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
