global:
  scrape_interval: 5s

scrape_configs:
  - job_name: chat
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: chat-cluster
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18081", "host.docker.internal:18082"]
