upstream chat-backend {
    server app1:8080;
    server app2:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                    'upstream_status=$upstream_status rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;
    add_header X-Upstream $upstream_addr always;

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
    location /api/ {
        proxy_pass http://chat-backend;
    }
    location /ws {
        proxy_pass http://chat-backend;
        # F8: nginx 1.30.5의 기본값도 HTTP/1.1이지만 실험 조건을 명시한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
