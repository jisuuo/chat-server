upstream chat-backend {
    server app1:8080;
    server app2:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                    'upstream_status=$upstream_status rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;
    add_header X-Upstream $upstream_addr always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 18090;

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
    location /api/ {
        proxy_pass http://chat-backend;
    }
    location /ws {
        proxy_pass http://chat-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 18090;
        # F8: 서버의 첫 ping보다 짧게 끊어 유휴 시간의 대조 조건을 만든다.
        proxy_read_timeout 5s;
    }
}
