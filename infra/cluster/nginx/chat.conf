upstream chat-backend {
    server app1:8080;
    server app2:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                    'upstream_status=$upstream_status rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;
    add_header X-Upstream $upstream_addr always;

    # F51: 원래 Host의 포트까지 Spring의 같은 origin 검사에 전달한다.
    proxy_set_header Host $http_host;
    # F52, ADR-086: 요청자가 보낸 X-Forwarded-For를 버리고 이 프록시가 본 주소만 전달한다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # F51: Tomcat이 X-Forwarded-Proto만 받으면 외부 포트를 80으로 바꾸므로 Compose의 공개 포트를 함께 보낸다.
    proxy_set_header X-Forwarded-Port 18090;

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
    location /api/ {
        proxy_pass http://chat-backend;
    }
    location /ws {
        proxy_pass http://chat-backend;
        # F8: 홉 단위 헤더는 nginx가 앱에 다시 전달해야 한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # nginx는 이 location에 proxy_set_header가 있으면 server 수준 값을 상속하지 않는다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 18090;
        # ADR-144: 서버의 10초 ping이 이 읽기 유휴 시간보다 짧다.
        proxy_read_timeout 60s;
    }
}
