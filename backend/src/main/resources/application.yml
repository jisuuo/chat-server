spring:
  application:
    name: chat
  jpa:
    # ADR-126: 요청이 끝날 때까지 연결을 잡지 않게 해서 JDBC와 같은 조건에서 비교한다.
    open-in-view: false
    hibernate:
      # ADR-125: Flyway가 스키마 원본이며 매핑 차이를 기동 시 확인한다.
      ddl-auto: validate
server:
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
      schema: ${chat.message-schema:A}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # 계획 7 세부 7A: 전달 지연의 분위수를 Prometheus 버킷에서 계산한다.
        chat.delivery: true
logging:
  level:
    ACCESS: INFO
    WS_ACCESS: INFO
  pattern:
    correlation: "[%X{requestId:-}] "
